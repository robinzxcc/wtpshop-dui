<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WTPSHOP DUI — local preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #222;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 12px 0 0;
      }
      button {
        background: #1a1a1a;
        border: 1px solid #333;
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { background: #252525; }
      button.primary { border-color: #666; }
      p.hint {
        margin: 0;
        font-size: 11px;
        color: #888;
        flex: 1 1 100%;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 88px);
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DUI preview (local)</h1>
      <button class="primary" type="button" id="btn-show">Show menu</button>
      <button type="button" id="btn-nui">NUI / mouse</button>
      <button type="button" id="btn-kb">Keyboard</button>
      <button type="button" id="btn-theme-def">Theme: Default</button>
      <button type="button" id="btn-theme-blk">Theme: Black</button>
      <button type="button" id="btn-toast">Test toast</button>
      <p class="hint">
        Run <code>.\PREVIEW.ps1</code> in this folder, then open
        <code>http://127.0.0.1:8765/preview.html</code> — not the raw file:// URL.
        In-game uses GitHub Pages until you push; reinject <code>wtpmenu.lua</code> after.
      </p>
    </header>
    <iframe id="dui" src="/index.html" title="WTPSHOP DUI"></iframe>
    <script>
      var frame = document.getElementById("dui");
      function post(data) {
        frame.contentWindow.postMessage(data, "*");
      }
      document.getElementById("btn-show").onclick = function () {
        post({
          action: "showUI",
          visible: true,
          inputMode: "nui",
          username: "PREVIEW",
          expiration: "N/A",
          index: 0,
          path: ["Settings"],
          elements: [
            { type: "button", label: "Example action" },
            { type: "checkbox", label: "Example toggle", checked: false },
            {
              type: "checkbox",
              label: "> 7 - PlayerOne",
              checked: true,
              metaData: [
                { key: "Distance", value: "42m" },
                { key: "Health", value: 200, color: "0, 255, 17" },
                { key: "Armour", value: 50, color: "0, 132, 255" },
              ],
            },
          ],
        });
      };
      document.getElementById("btn-nui").onclick = function () {
        post({ action: "setInputMode", mode: "nui" });
      };
      document.getElementById("btn-kb").onclick = function () {
        post({ action: "setInputMode", mode: "keyboard" });
      };
      document.getElementById("btn-theme-def").onclick = function () {
        post({
          action: "updateBanner",
          bannerColor: "255, 255, 255",
          bannerLink: "https://royalcdn.pages.dev/titenirobinz/wtp1-d6fd8cf3a1e0.gif",
        });
      };
      document.getElementById("btn-theme-blk").onclick = function () {
        post({
          action: "updateBanner",
          bannerColor: "0, 0, 0",
          bannerLink: "https://royalcdn.pages.dev/titenirobinz/wtp2-2cd269bafa68.gif",
        });
      };
      document.getElementById("btn-toast").onclick = function () {
        post({
          action: "showNotification",
          type: "success",
          title: "WTPSHOP",
          desc: "Loaded.",
          duration: 4000,
        });
      };
    </script>
  </body>
</html>
